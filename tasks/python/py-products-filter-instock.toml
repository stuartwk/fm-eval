id = "py-products-filter-instock"
lang = "python"
kind = "modify"
tier = "medium"
instruction = """
Let GET /products filter by an optional ?in_stock= query parameter:
"true" returns only products with stock greater than 0, "false" returns
only products with zero stock. Any other non-empty value is a 400 with the
bad_query error code. Without the parameter, behave exactly as now. The
response format stays the same (not paginated).
"""
context = ["product_store.py", "respond.py"]
target = "product_handlers.py"
hidden_test = "test_hidden_products_filter_instock.py"
test_cmd = ["python3", "-m", "unittest", "discover", "-p", "test_*.py"]
