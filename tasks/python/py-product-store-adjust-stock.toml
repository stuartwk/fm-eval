instruction = """
Add an adjust_stock(id, delta) method to ProductStore. It adds delta (which
may be negative) to the product's stock, stores it, and returns the updated
product. It returns None and leaves the stock unchanged if the product does
not exist or if the stock would drop below zero. Follow the style of the
other store methods.
"""
